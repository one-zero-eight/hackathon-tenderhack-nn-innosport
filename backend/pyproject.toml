[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [{ name = "one-zero-eight" }]
urls = { homepage = "https://t.me/one_zero_eight" }
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "joserfc>=1.6.5",
    "colorlog>=6.8.2",
    "cryptography>=44.0.0",
    "fastapi[standard]>=0.115.6",
    "fastapi-swagger>=0.2.3",
    "fastapi-derive-responses>=0.1.7",
    "gunicorn>=23.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.2",
    "pyyaml>=6.0.2",
    "ruff>=0.9.2",
    "uvicorn>=0.34.0",
    "beanie>=1.30.0,<2.0.0",
    "polars>=1.44.2",
    "fastexcel>=0.21.0",
    "pypdf>=5.1.0",
    "markdown-it-py>=4.2.0",
    # "sentence-transformers>=6.0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "prek>=0.3.8",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "astor>=0.8.1",
    "pygments>=2.18.0",
    "simple-term-menu>=1.6.6",
]

[tool.ruff]
line-length = 120
target-version = "py314"
# Exploratory notebooks are not part of the API or maintained Python scripts.
extend-exclude = ["*.ipynb"]
force-exclude = true
lint.preview = true
lint.extend-select = [
    "E",      # pycodestyle error
    "I",      # isort
    "N",      # pep-8 naming
    "S",      # bandit
    "UP",     # pyupgrade
    "PL",     # pylint
    "A",      # flake8-builtins
    "DTZ",    # flake8-datetimez
    "ICN",    # flake8-import-conventions
    "TID251", # flake8-tidy-imports banned-api
]
lint.extend-ignore = [
    "PLC0415", # import-outside-top-level
    "PLR",     # pylint refactor
    "E501",    # line-too-long (handled by formatter)
    "PLW1514", # unspecified-encoding in open(...) function
]
lint.unfixable = ["F401"] # unused-import — report only, do not remove on fix
[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is standard in pytest
    "PLC1901", # exact empty-string assertions distinguish "" from None
    "PLC2701", # focused tests may import internal helpers
]
# Local tooling uses fixed commands, argument lists (no shell), and PATH lookup.
"ingest/ingest_documents.py" = ["S404", "S603", "S607"]
"src/prepare.py" = ["S404", "S603", "S607"]
"src/logging_.py" = ["S101"] # FastAPI internal invariant, not input validation
"src/storages/mongo/*.py" = ["PLC2701"] # shared internal __base__ module
"src/storages/mongo/__base__.py" = [
    "PLW3201",
] # Pydantic's documented schema hook
[tool.ruff.lint.flake8-builtins]
ignorelist = ["id"]
[tool.ruff.lint.flake8-import-conventions]
banned-from = ["datetime", "time"]
[tool.ruff.lint.flake8-import-conventions.aliases]
datetime = "dtm"
time = "tm"
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Python 3.14+ uses deferred annotations by default; do not use this future import."

[tool.uv.workspace]
members = ["ingest"]
