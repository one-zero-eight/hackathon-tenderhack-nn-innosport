$schema: https://json-schema.org/draft-07/schema
$defs:
  Environment:
    enum:
    - development
    - production
    title: Environment
    type: string
  KnowledgeSearchSettings:
    additionalProperties: false
    description: Local semantic search settings for the Memvid knowledge base.
    properties:
      embedding_model:
        default: mxbai-embed-large
        description: Ollama embedding model used when the Memvid vectors were created
        title: Embedding Model
        type: string
      ollama_base_url:
        default: http://127.0.0.1:11434
        description: Local Ollama API used to embed search queries
        title: Ollama Base Url
        type: string
    title: KnowledgeSearchSettings
    type: object
  LlamaCppSettings:
    additionalProperties: false
    description: Optional local llama.cpp server for grounded answers.
    properties:
      enabled:
        default: false
        description: If false, answers are extracted directly from retrieved sources
        title: Enabled
        type: boolean
      base_url:
        default: http://127.0.0.1:8080
        description: OpenAI-compatible llama.cpp server, e.g. http://127.0.0.1:8080
          or http://192.168.1.10:8080
        title: Base Url
        type: string
      model:
        default: ''
        description: Model name forwarded to /v1/chat/completions. Empty string lets
          llama.cpp use its loaded model.
        title: Model
        type: string
      max_tool_rounds:
        default: 2
        description: Maximum knowledge tool rounds before the agent must respond
        maximum: 8
        minimum: 1
        title: Max Tool Rounds
        type: integer
      answer_max_tokens:
        default: 1024
        description: Maximum output tokens for a natural-language support answer
        exclusiveMinimum: 0
        maximum: 8192
        title: Answer Max Tokens
        type: integer
      context_tokens:
        default: 2048
        description: Context budget per server slot; must not exceed llama.cpp --ctx-size
          / --parallel
        maximum: 131072
        minimum: 1024
        title: Context Tokens
        type: integer
      temperature:
        default: 0.0
        maximum: 2
        minimum: 0
        title: Temperature
        type: number
    title: LlamaCppSettings
    type: object
additionalProperties: false
description: Settings for the application.
properties:
  $schema:
    anyOf:
    - type: string
    - type: 'null'
    default: null
    title: $Schema
  environment:
    $ref: '#/$defs/Environment'
    default: development
    description: App environment flag
  app_root_path:
    default: ''
    description: Prefix for the API path (e.g. "/api/v0")
    title: App Root Path
    type: string
  database_uri:
    description: MongoDB database settings
    examples:
    - mongodb://mongoadmin:secret@127.0.0.1:27017/db?authSource=admin
    - mongodb://mongoadmin:secret@db:27017/db?authSource=admin
    format: password
    title: Database Uri
    type: string
    writeOnly: true
  cors_allow_origin_regex:
    default: .*
    description: 'Allowed origins for CORS: from which domains requests to the API
      are allowed. Specify as a regex: `https://.*.innohassle.ru`'
    title: Cors Allow Origin Regex
    type: string
  knowledge_memvid_path:
    default: data/knowledge.mv2
    description: Path to the teammate-produced vector Memvid knowledge base
    title: Knowledge Memvid Path
    type: string
  knowledge_search:
    $ref: '#/$defs/KnowledgeSearchSettings'
    description: Local semantic retrieval configuration
  llama_cpp:
    $ref: '#/$defs/LlamaCppSettings'
    description: Local llama.cpp answer generator. Disabled by default; the API never
      calls OpenAI/Gemini/Claude.
required:
- database_uri
title: Settings
type: object
