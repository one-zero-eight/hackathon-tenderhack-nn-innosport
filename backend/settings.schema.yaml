$schema: https://json-schema.org/draft-07/schema
$defs:
  AuditEmailSettings:
    additionalProperties: false
    description: SMTP delivery and daily schedule; credentials belong in local settings.yaml.
    properties:
      enabled:
        default: false
        description: Enable daily delivery; manual delivery only requires complete
          SMTP settings
        title: Enabled
        type: boolean
      host:
        default: ''
        title: Host
        type: string
      port:
        default: 465
        maximum: 65535
        minimum: 1
        title: Port
        type: integer
      security:
        default: ssl
        enum:
        - ssl
        - starttls
        title: Security
        type: string
      username:
        default: ''
        title: Username
        type: string
      password:
        default: ''
        format: password
        title: Password
        type: string
        writeOnly: true
      sender:
        anyOf:
        - format: email
          type: string
        - type: 'null'
        default: null
        title: Sender
      recipient:
        anyOf:
        - format: email
          type: string
        - type: 'null'
        default: null
        title: Recipient
      send_at:
        default: 09:00:00
        description: Daily wall-clock time in the configured timezone
        format: time
        title: Send At
        type: string
      timezone:
        default: Europe/Moscow
        title: Timezone
        type: string
    title: AuditEmailSettings
    type: object
  AuditSettings:
    additionalProperties: false
    description: Administrative feedback analysis and email delivery.
    properties:
      max_tokens:
        default: 4096
        description: Maximum output tokens for an audit report; independent of short
          chat answers
        maximum: 16384
        minimum: 512
        title: Max Tokens
        type: integer
      email:
        $ref: '#/$defs/AuditEmailSettings'
    title: AuditSettings
    type: object
  Environment:
    enum:
    - development
    - production
    title: Environment
    type: string
  KnowledgeSearchSettings:
    additionalProperties: false
    description: Semantic search settings for the MongoDB-backed knowledge base.
    properties:
      embedding_model:
        default: mxbai-embed-large
        description: Ollama embedding model used when the knowledge_chunks vectors
          were created
        title: Embedding Model
        type: string
      ollama_base_url:
        default: http://127.0.0.1:11434
        description: Local Ollama API used to embed search queries
        title: Ollama Base Url
        type: string
    title: KnowledgeSearchSettings
    type: object
  LlamaCppSettings:
    additionalProperties: false
    description: Optional local llama.cpp server for grounded answers.
    properties:
      enabled:
        default: false
        description: If false, answers are extracted directly from retrieved sources
        title: Enabled
        type: boolean
      base_url:
        default: http://127.0.0.1:8080
        description: OpenAI-compatible llama.cpp server, e.g. http://127.0.0.1:8080
          or http://192.168.1.10:8080
        title: Base Url
        type: string
      model:
        default: ''
        description: Model name forwarded to /v1/chat/completions. Empty string lets
          llama.cpp use its loaded model.
        title: Model
        type: string
      max_tool_rounds:
        default: 2
        description: Maximum knowledge tool rounds before the agent must respond
        maximum: 8
        minimum: 1
        title: Max Tool Rounds
        type: integer
      answer_max_tokens:
        default: 1024
        description: Maximum output tokens for a natural-language support answer
        exclusiveMinimum: 0
        maximum: 8192
        title: Answer Max Tokens
        type: integer
      context_tokens:
        default: 2048
        description: Context budget per server slot; must not exceed llama.cpp --ctx-size
          / --parallel
        maximum: 131072
        minimum: 1024
        title: Context Tokens
        type: integer
      temperature:
        default: 0.0
        maximum: 2
        minimum: 0
        title: Temperature
        type: number
      enable_thinking:
        default: false
        description: 'Native thinking channel for answers/abuse. Leave false: Qwen
          3.5 spends the token budget on thoughts and never finishes JSON.'
        title: Enable Thinking
        type: boolean
    title: LlamaCppSettings
    type: object
  MlxSettings:
    additionalProperties: false
    description: Optional local MLX server (mlx-vlm) for grounded answers.
    properties:
      base_url:
        default: http://127.0.0.1:8083
        description: OpenAI-compatible MLX server, e.g. http://127.0.0.1:8083 or http://host.docker.internal:8083
        title: Base Url
        type: string
      model:
        default: ''
        description: Model name forwarded to /v1/chat/completions. Empty string lets
          the MLX server use its loaded model.
        title: Model
        type: string
      max_tool_rounds:
        default: 2
        description: Maximum knowledge tool rounds before the agent must respond
        maximum: 8
        minimum: 1
        title: Max Tool Rounds
        type: integer
      answer_max_tokens:
        default: 1024
        description: Maximum output tokens for a natural-language support answer
        exclusiveMinimum: 0
        maximum: 8192
        title: Answer Max Tokens
        type: integer
      context_tokens:
        default: 2048
        description: Approximate context budget used to compact the agent transcript
        maximum: 131072
        minimum: 1024
        title: Context Tokens
        type: integer
      temperature:
        default: 0.0
        maximum: 2
        minimum: 0
        title: Temperature
        type: number
      enable_thinking:
        default: false
        description: Native thinking channel for answers/abuse. Gemma ignores this;
          quality uses the in-schema reason field.
        title: Enable Thinking
        type: boolean
    title: MlxSettings
    type: object
  ModelProvider:
    enum:
    - llama_cpp
    - mlx
    title: ModelProvider
    type: string
additionalProperties: false
description: Settings for the application.
properties:
  $schema:
    anyOf:
    - type: string
    - type: 'null'
    default: null
    title: $Schema
  environment:
    $ref: '#/$defs/Environment'
    default: development
    description: App environment flag
  app_root_path:
    default: ''
    description: Prefix for the API path (e.g. "/api/v0")
    title: App Root Path
    type: string
  database_uri:
    description: MongoDB database settings
    examples:
    - mongodb://127.0.0.1:27017/db?directConnection=true
    - mongodb://database:27017/db?directConnection=true
    format: password
    title: Database Uri
    type: string
    writeOnly: true
  cors_allow_origin_regex:
    default: .*
    description: 'Allowed origins for CORS: from which domains requests to the API
      are allowed. Specify as a regex: `https://.*.innohassle.ru`'
    title: Cors Allow Origin Regex
    type: string
  knowledge_search:
    $ref: '#/$defs/KnowledgeSearchSettings'
    description: Local semantic retrieval configuration
  model_provider:
    $ref: '#/$defs/ModelProvider'
    default: llama_cpp
    description: 'Local answer generator: llama_cpp or mlx. The API never calls OpenAI/Gemini/Claude.'
  llama_cpp:
    $ref: '#/$defs/LlamaCppSettings'
    description: llama.cpp server used when model_provider is llama_cpp. Disabled
      by default.
  audit:
    $ref: '#/$defs/AuditSettings'
    description: Administrative audit report generation settings
  mlx:
    $ref: '#/$defs/MlxSettings'
    description: MLX server used when model_provider is mlx. Run scripts/start_mlx_server.sh
      on the Mac host.
required:
- database_uri
title: Settings
type: object
