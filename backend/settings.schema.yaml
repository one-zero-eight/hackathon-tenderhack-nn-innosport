$schema: https://json-schema.org/draft-07/schema
$defs:
  Environment:
    enum:
    - development
    - production
    title: Environment
    type: string
  LlamaCppSettings:
    additionalProperties: false
    description: Optional local llama.cpp server for topic classification and grounded
      answers.
    properties:
      enabled:
        default: false
        description: If false, classification is fully deterministic
        title: Enabled
        type: boolean
      base_url:
        default: http://127.0.0.1:8080
        description: OpenAI-compatible llama.cpp server, e.g. http://127.0.0.1:8080
          or http://192.168.1.10:8080
        title: Base Url
        type: string
      model:
        default: ''
        description: Model name forwarded to /v1/chat/completions. Empty string lets
          llama.cpp use its loaded model.
        title: Model
        type: string
      timeout_seconds:
        default: 8.0
        description: HTTP timeout; on timeout the API falls back to keyword scoring
        exclusiveMinimum: 0
        maximum: 120
        title: Timeout Seconds
        type: number
      max_tokens:
        default: 24
        description: Maximum output tokens for topic classification
        exclusiveMinimum: 0
        maximum: 8192
        title: Max Tokens
        type: integer
      answer_max_tokens:
        default: 192
        description: Maximum output tokens for a grounded answer
        exclusiveMinimum: 0
        maximum: 8192
        title: Answer Max Tokens
        type: integer
      temperature:
        default: 0.0
        maximum: 2
        minimum: 0
        title: Temperature
        type: number
    title: LlamaCppSettings
    type: object
additionalProperties: false
description: Settings for the application.
properties:
  $schema:
    anyOf:
    - type: string
    - type: 'null'
    default: null
    title: $Schema
  environment:
    $ref: '#/$defs/Environment'
    default: development
    description: App environment flag
  app_root_path:
    default: ''
    description: Prefix for the API path (e.g. "/api/v0")
    title: App Root Path
    type: string
  database_uri:
    description: MongoDB database settings
    examples:
    - mongodb://mongoadmin:secret@127.0.0.1:27017/db?authSource=admin
    - mongodb://mongoadmin:secret@db:27017/db?authSource=admin
    format: password
    title: Database Uri
    type: string
    writeOnly: true
  cors_allow_origin_regex:
    default: .*
    description: 'Allowed origins for CORS: from which domains requests to the API
      are allowed. Specify as a regex: `https://.*.innohassle.ru`'
    title: Cors Allow Origin Regex
    type: string
  knowledge_dir:
    default: data
    description: Directory with topic_catalog.json, relative to the backend working
      directory
    title: Knowledge Dir
    type: string
  knowledge_memvid_path:
    default: data/knowledge.mv2
    description: Path to the teammate-produced lexical Memvid knowledge base
    title: Knowledge Memvid Path
    type: string
  llama_cpp:
    $ref: '#/$defs/LlamaCppSettings'
    description: Local llama.cpp classifier. Disabled by default; the API never calls
      OpenAI/Gemini/Claude.
required:
- database_uri
title: Settings
type: object
