[*]
n-gpu-layers = 99
flash-attn = on
threads = 8
threads-batch = 8
parallel = 1
temp = 0
load-on-startup = qwen2.5-3b-instruct

[qwen2.5-3b-instruct]
model = models/qwen2.5-3b-instruct-q4_k_m.gguf
ctx-size = 2048
alias = qwen2.5-3b-instruct-q4_k_m, qwen

[qwen3.5-4b]
model = models/Qwen3.5-4B-Q4_K_M.gguf
ctx-size = 2048
alias = qwen3.5-4b, Qwen/Qwen3.5-4B

[gemma-4-e4b-it]
model = models/gemma-4-E4B-it-Q4_K_M.gguf
ctx-size = 2048
alias = gemma-4-e4b, google/gemma-4-E4B-it

[qwen3.5-9b]
model = models/Qwen3.5-9B-Q4_K_M.gguf
ctx-size = 2048
alias = qwen3.5-9b, Qwen/Qwen3.5-9B

[Qwen3-Reranker-0.6B]
model = models/Qwen3-Reranker-0.6B-Q4_K_M.gguf
reranking = true
pooling = rank
embedding = true
ctx-size = 8192
alias = Qwen/Qwen3-Reranker-0.6B

[Qwen3-Reranker-4B]
model = models/Qwen3-Reranker-4B-Q4_K_M.gguf
reranking = true
pooling = rank
embedding = true
ctx-size = 8192
alias = Qwen/Qwen3-Reranker-4B
