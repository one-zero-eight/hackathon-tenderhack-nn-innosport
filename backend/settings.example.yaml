# yaml-language-server: $schema=settings.schema.yaml
$schema: './settings.schema.yaml'
environment: development
database_uri: mongodb://mongoadmin:secret@127.0.0.1:27017/db?authSource=admin # replace 127.0.0.1 with db in Docker
knowledge_memvid_path: data/knowledge.mv2
knowledge_search:
  embedding_model: mxbai-embed-large
  ollama_base_url: http://127.0.0.1:11434
audit:
  max_tokens: 4096
  email:
    enabled: false # Enable after filling SMTP settings in local settings.yaml
    host: ''
    port: 465
    security: ssl # ssl (465) or starttls (587); TLS is required
    username: ''
    password: '' # SMTP app password; never commit real credentials
    sender: null # Sender email address
    recipient: null # Report recipient email address
    send_at: '09:00:00'
    timezone: Europe/Moscow
model_provider: llama_cpp # llama_cpp | mlx
llama_cpp:
  enabled: false
  base_url: http://127.0.0.1:8080
  model: ''
  max_tool_rounds: 2
  answer_max_tokens: 1024
  context_tokens: 2048
  temperature: 0
mlx:
  base_url: http://127.0.0.1:8083
  model: gemma-4-e2b-it-4bit
  max_tool_rounds: 2
  answer_max_tokens: 1024
  context_tokens: 2048
  temperature: 0
