# yaml-language-server: $schema=settings.schema.yaml
$schema: './settings.schema.yaml'
environment: development
database_uri: mongodb://mongoadmin:secret@database:27017/db?authSource=admin&directConnection=true
knowledge_search:
  embedding_model: mxbai-embed-large
  ollama_base_url: http://host.docker.internal:11434
audit:
  max_tokens: 4096
  email:
    enabled: false
    host: ''
    port: 465
    security: ssl
    username: ''
    password: '' # Never put real credentials in this tracked file; mount local settings.yaml instead
    sender: null
    recipient: null
    send_at: '09:00:00'
    timezone: Europe/Moscow
model_provider: mlx # answers/abuse on MLX; L1/L2 stays on llama.cpp
llama_cpp:
  enabled: true
  base_url: http://host.docker.internal:8081
  model: qwen3.5-4b
  max_tool_rounds: 2
  answer_max_tokens: 1024
  context_tokens: 4096
  temperature: 0
  enable_thinking: false
mlx:
  base_url: http://host.docker.internal:8083
  model: gemma-4-e2b-it-4bit
  max_tool_rounds: 2
  answer_max_tokens: 1024
  context_tokens: 4096
  temperature: 0
  enable_thinking: false
